spring.application.name=rs-management
jwt.secret.key=thisisthesesecretkeyevercreatedmydevelopmentcarrer
server.servlet.context-path=/api/v1.0
logging.level.org.springframework=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
server.port=6969


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HSF301;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false




