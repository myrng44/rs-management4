# =================================================
# Application identity & server
# =================================================
spring.application.name=${APP_NAME:rs-management4}
server.port=${APP_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Connection pool settings
#spring.datasource.hikari.maximum-pool-size=20
#spring.datasource.hikari.minimum-idle=5
#spring.datasource.hikari.connection-timeout=30000
#spring.datasource.hikari.idle-timeout=600000
#spring.datasource.hikari.max-lifetime=1800000

# Database Configuration
## Local database
# =================================================
# Database Configuration (đọc từ biến môi trường)
# POSTGRES_HOST: có thể là 'localhost' (local dev) hoặc 'db' (docker-compose service)
# =================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rs_management_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:mypassword8325}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.elasticsearch.uris=https://${ES_HOST:localhost}:${ES_PORT:9200}
spring.elasticsearch.username=${ES_USERNAME:elastic}
spring.elasticsearch.password=${ES_PASSWORD:mypassword8325}
spring.elasticsearch.connection-timeout=10s
spring.elasticsearch.socket-timeout=30s
spring.data.elasticsearch.repositories.enabled=true

# ===== Search Framework Configuration =====
rs.elasticsearch.enabled=true
rs.elasticsearch.default-page-size=20
rs.elasticsearch.max-page-size=100
rs.elasticsearch.enable-fuzzy-search=true
rs.elasticsearch.enable-auto-sync=true
rs.elasticsearch.sync-delay-ms=1000

rs.elasticsearch.ssl.enabled=true
rs.elasticsearch.ssl.verification=false

# Elasticsearch specific
rs.elasticsearch.elasticsearch.enabled=true
rs.elasticsearch.elasticsearch.bulk-size=100
rs.elasticsearch.elasticsearch.refresh-interval=1s
rs.elasticsearch.elasticsearch.max-retries=3
rs.elasticsearch.elasticsearch.retry-delay-ms=5000
rs.elasticsearch.elasticsearch.fallback-to-database=true

# =================================================
# Flyway (DB migration)
# =================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# =================================================
# JPA / Hibernate
# =================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =================================================
# (Optional) Allow Hibernate export DDL schema to file
# =================================================
#spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=ddl/V1__init_schema.sql
#spring.jpa.generate-ddl=true


# =================================================
# Security config (keeps your existing keys paths & jwt settings)
# =================================================
rs.security.jwt.expirationMillis=${RS_SECURITY_JWT_EXPIRATION:1800}
rs.security.jwt.refresh-token.expiration=${RS_SECURITY_JWT_REFRESH_EXPIRATION:3000}

# RSA Key paths (kept as-is from your repo; consider moving keys to env/secret manager for prod)
rs.key.public-key-file=${RS_KEY_PUBLIC_FILE:src/main/resources/keys/public.pem}
rs.key.private-key-file=${RS_KEY_PRIVATE_FILE:src/main/resources/keys/private.pem}
rs.key.secret=${RS_KEY_SECRET:jkNF544fDFfdvvdgvDvd5Vd15svd5fvg14vg14d5SDDBVFdbvd5bv1gvvg51dgVDVDv1d5vdvsvBNFNLKHSoledadSmileOpera2TheStar}

# =================================================
# Swagger / OpenAPI
# =================================================
## Specify the path of the OpenAPI documentation
springdoc.api-docs.path=/v3/api-docs
## Specify the path of the Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
## Enable or disable Swagger UI
springdoc.swagger-ui.enabled=true
##http://localhost:8080/swagger-ui/index.html
##http://localhost:8080/swagger-ui.html

# =================================================
# API config
# =================================================
rs.api.main.baseUrl=secured/rest/v1
rs.api.main.publicUrl=public/rest/v1

# =================================================
# CORS
# =================================================
rs.cors.allowed-origins=\
http://localhost:*,\
http://localhost:5173,\

# =================================================
# LOG
# =================================================
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.transaction=OFF
logging.level.org.springframework.orm.jpa=OFF
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.data.elasticsearch=DEBUG
logging.level.org.elasticsearch=WARN
logging.level.co.elastic.clients=DEBUG
logging.level.org.elasticsearch.client=DEBUG
logging.level.org.apache.http=DEBUG
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR